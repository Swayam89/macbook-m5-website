name: iOS app

on:
  push:
    branches: [main, "claude/**"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v6

      - name: Select newest stable Xcode
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Pick an iPhone simulator
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              version = (int(m.group(1)), int(m.group(2)))
              for d in devices:
                  if re.fullmatch(r"iPhone \d+ Pro", d["name"]):
                      key = (version, d["name"])
                      if best is None or key > best[0]:
                          best = (key, d["udid"], d["name"])
          print(best[1])
          print(best[0], best[2], file=sys.stderr)
          ')
          echo "SIM_ID=$id" >> "$GITHUB_ENV"

      - name: Build and test
        env:
          # Turns on ServiceProbeTests, which loads every built-in site and attaches screenshots.
          TEST_RUNNER_ALTS_PROBE: "1"
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Alts.xcodeproj \
            -scheme Alts \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -resultBundlePath build/Results.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild.log | { if command -v xcbeautify >/dev/null; then xcbeautify --renderer github-actions; else cat; fi; }

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p build/attachments
          if [ -d build/Results.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Results.xcresult --output-path build/attachments || true
          fi
          ls -la build/attachments

      # Temporary, for review from a sandbox that can reach git but not the artifact storage.
      # Pushes resized screenshots to a hidden ref (not a branch) that can be fetched with git.
      - name: Push screenshots to a review ref
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(build/attachments/*)
          if [ ${#files[@]} -le 1 ]; then echo "No attachments"; exit 0; fi
          out=$(mktemp -d)
          for f in "${files[@]}"; do
            case "$f" in
              *.png|*.jpg|*.jpeg|*.heic) sips -s format jpeg -s formatOptions 70 -Z 1000 "$f" --out "$out/$(basename "${f%.*}").jpg" >/dev/null ;;
              *) cp "$f" "$out/" ;;
            esac
          done
          cd "$out"
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots from run $GITHUB_RUN_ID"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/ci-screens/${GITHUB_RUN_ID}"
          echo "Pushed refs/ci-screens/${GITHUB_RUN_ID}"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: alts-results
          path: |
            ios/build/attachments
            ios/build/xcodebuild.log
          if-no-files-found: ignore
