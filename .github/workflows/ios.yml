name: iOS app

on:
  push:
    branches: [main, "claude/**"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v6

      - name: Select newest stable Xcode
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Pick an iPhone simulator
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              version = (int(m.group(1)), int(m.group(2)))
              for d in devices:
                  if re.fullmatch(r"iPhone \d+ Pro", d["name"]):
                      key = (version, d["name"])
                      if best is None or key > best[0]:
                          best = (key, d["udid"], d["name"])
          print(best[1])
          print(best[0], best[2], file=sys.stderr)
          ')
          echo "SIM_ID=$id" >> "$GITHUB_ENV"

      - name: Build and test
        env:
          # Turns on ServiceProbeTests, which loads every built-in site and attaches screenshots.
          TEST_RUNNER_ALTS_PROBE: "1"
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Alts.xcodeproj \
            -scheme Alts \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -resultBundlePath build/Results.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild.log | { if command -v xcbeautify >/dev/null; then xcbeautify --renderer github-actions; else cat; fi; }

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p build/attachments
          if [ -d build/Results.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Results.xcresult --output-path build/attachments || true
          fi
          ls -la build/attachments

      # Temporary: prints the probe summary and a few small screenshots into the log, for review
      # from an environment that can't download artifacts. Remove once reviewed.
      - name: Print review material
        if: always()
        run: |
          [ -f build/attachments/manifest.json ] || exit 0
          /usr/bin/python3 - <<'PY'
          import base64, json, os, subprocess, tempfile
          found = {}
          for test in json.load(open("build/attachments/manifest.json")):
              for a in test.get("attachments", []):
                  key = a.get("suggestedHumanReadableName", "").split("_0_")[0]
                  found[key] = os.path.join("build/attachments", a["exportedFileName"])
          if "probe-summary" in found:
              print("=== probe-summary")
              print(open(found["probe-summary"]).read())
          for key in ["6-list", "2-new-space", "4-space-open", "8-edit-space"]:
              if key not in found:
                  continue
              out = tempfile.mktemp(suffix=".jpg")
              subprocess.run(["sips", "-s", "format", "jpeg", "-s", "formatOptions", "45", "-Z", "640", found[key], "--out", out], check=True, capture_output=True)
              data = base64.b64encode(open(out, "rb").read()).decode()
              print(f"=== {key} {len(data)}")
              for i in range(0, len(data), 4000):
                  print(data[i:i + 4000])
          PY

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: alts-results
          path: |
            ios/build/attachments
            ios/build/xcodebuild.log
          if-no-files-found: ignore
