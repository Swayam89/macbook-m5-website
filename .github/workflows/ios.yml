name: iOS app

on:
  push:
    branches: [main, "claude/**"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 50
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v6

      - name: Select newest stable Xcode
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Pick an iPhone simulator
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              version = (int(m.group(1)), int(m.group(2)))
              for d in devices:
                  if re.fullmatch(r"iPhone \d+ Pro", d["name"]):
                      key = (version, d["name"])
                      if best is None or key > best[0]:
                          best = (key, d["udid"], d["name"])
          print(best[1])
          print(best[0], best[2], file=sys.stderr)
          ')
          echo "SIM_ID=$id" >> "$GITHUB_ENV"

      - name: Build
        id: build
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build-for-testing \
            -project Alts.xcodeproj -scheme Alts \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/build.log | { if command -v xcbeautify >/dev/null; then xcbeautify --renderer github-actions; else cat; fi; }

      - name: Unit and UI tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Alts.xcodeproj -scheme Alts \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath build/DerivedData \
            -parallel-testing-enabled NO \
            -skip-testing:AltsTests/ServiceProbeTests \
            -resultBundlePath build/Tests.xcresult \
            2>&1 | tee build/tests.log | { if command -v xcbeautify >/dev/null; then xcbeautify --renderer github-actions; else cat; fi; }

      # Loads every built-in site and records what it shows. Sites change on their own schedule,
      # so this reports instead of failing the build. It takes several minutes, so it only runs
      # when the workflow is started by hand.
      - name: Probe built-in sites
        if: always() && steps.build.outcome == 'success' && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          TEST_RUNNER_ALTS_PROBE: "1"
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Alts.xcodeproj -scheme Alts \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath build/DerivedData \
            -parallel-testing-enabled NO \
            -only-testing:AltsTests/ServiceProbeTests \
            -resultBundlePath build/Probe.xcresult \
            2>&1 | tee build/probe.log | { if command -v xcbeautify >/dev/null; then xcbeautify --renderer github-actions; else cat; fi; }

      - name: Export screenshots
        if: always()
        run: |
          for bundle in Tests Probe; do
            mkdir -p "build/attachments/$bundle"
            if [ -d "build/$bundle.xcresult" ]; then
              xcrun xcresulttool export attachments --path "build/$bundle.xcresult" --output-path "build/attachments/$bundle" || true
            fi
          done
          ls -la build/attachments/*

      # Swift Testing failure messages and attachments live in the result bundles, not the log.
      - name: Show failures and probe summary
        if: always()
        continue-on-error: true
        run: |
          for bundle in Tests Probe; do
            [ -d "build/$bundle.xcresult" ] || continue
            xcrun xcresulttool get test-results tests --path "build/$bundle.xcresult" --format json > "build/$bundle-results.json" || continue
            /usr/bin/python3 - "build/$bundle-results.json" <<'PY'
          import json, sys
          def walk(node, path):
              if node.get("nodeType") == "Failure Message":
                  print("FAILED", " > ".join(path[-2:]), "::", node.get("name", ""))
              for child in node.get("children", []):
                  walk(child, path + [node.get("name", "")])
          for node in json.load(open(sys.argv[1])).get("testNodes", []):
              walk(node, [])
          PY
          done
          /usr/bin/python3 - <<'PY'
          import glob, json, os
          for manifest in glob.glob("build/attachments/*/manifest.json"):
              for test in json.load(open(manifest)):
                  for a in test.get("attachments", []):
                      if a.get("suggestedHumanReadableName", "").startswith("probe-summary"):
                          print(open(os.path.join(os.path.dirname(manifest), a["exportedFileName"])).read())
          PY

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: alts-results
          path: |
            ios/build/attachments
            ios/build/*.log
          if-no-files-found: ignore
